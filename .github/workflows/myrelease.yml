---
name: My Release VerneMQ

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Default OTP version used for current releases
  DEFAULT_RELEASE_OTP: 27.2

jobs:

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: erlang:27.3.4.9-slim
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          apt-get -qq update
          apt-get -qq install -y \
            build-essential g++ cmake \
            libsnappy-dev libssl-dev libncurses-dev \
            git gh
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Cache _build/default
        uses: actions/cache@v5
        with:
          path: _build/default
          key: _build_default-cache-bookworm-otp-${{env.DEFAULT_RELEASE_OTP}}-v2-hash-${{hashFiles('rebar.lock')}}
      - name: Cache rebar3
        uses: actions/cache@v5
        with:
          path: ~/.cache/rebar3
          key: rebar3-cache-bookworm-otp-${{env.DEFAULT_RELEASE_OTP}}-v2-hash-${{hashFiles('rebar.lock')}}
      - name: Build release
        run: make rel
      - name: Package and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          RELEASE_FILE="vernemq-${TAG}.bookworm.x86_64.tar.gz"
          tar -czf "${RELEASE_FILE}" -C _build/default/rel/vernemq .
          gh release create "${TAG}" \
            --title "VerneMQ ${TAG}" \
            --generate-notes \
            "${RELEASE_FILE}"
 